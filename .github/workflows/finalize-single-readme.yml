name: Finalize single multilingual README

on:
  push:
    paths:
      - '.github/workflows/finalize-single-readme.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build one multilingual README
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          docs = Path('docs')
          langs = [
              ('en', 'English', 'README.en.md'),
              ('ru', 'Русский', 'README.ru.md'),
              ('pt-br', 'Português (Brasil)', 'README.pt-BR.md'),
              ('es', 'Español', 'README.es-ES.md'),
              ('de', 'Deutsch', 'README.de.md'),
              ('fr', 'Français', 'README.fr.md'),
              ('it', 'Italiano', 'README.it.md'),
              ('pl', 'Polski', 'README.pl.md'),
              ('zh-cn', '简体中文', 'README.zh-CN.md'),
              ('ja', '日本語', 'README.ja.md'),
              ('ko', '한국어', 'README.ko.md'),
          ]

          def blocks(text):
              lines = text.splitlines()
              starts = [i for i, line in enumerate(lines) if line.startswith('## ')]
              result = []
              for n, start in enumerate(starts):
                  end = starts[n + 1] if n + 1 < len(starts) else len(lines)
                  result.append('\n'.join(lines[start:end]).strip())
              return result

          def demote(block):
              out = []
              for line in block.splitlines():
                  if line.startswith('### '):
                      line = '#' + line
                  elif line.startswith('## '):
                      line = '#' + line
                  out.append(line)
              return '\n'.join(out)

          head = '''# Metamorph: Creative Menu

<a id="languages"></a>

## Choose your language

| Language | Open guide |
|---|---|
'''
          for code, label, filename in langs:
              head += f'| {label} | [{label}](#{code}) |\n'
          head += '''
> Choose your language above. The first section in every language is **Installation**, including the exact mod folder, the required **Unsafe mods** setting, and the final TAB check.

### Folder check before starting Noita

The final installation must contain:

```text
Noita/
└─ mods/
   └─ metamorph_creative_menu/
      ├─ mod.xml
      ├─ init.lua
      ├─ mod_id.txt
      ├─ NoitaPatcher/
      └─ files/
```

If you see `metamorph_creative_menu/metamorph_creative_menu/mod.xml`, the archive was extracted one folder too deep.

---
'''
          output = [head]
          for code, label, filename in langs:
              text = (docs / filename).read_text(encoding='utf-8')
              parts = blocks(text)
              if len(parts) < 3:
                  raise RuntimeError(f'Unexpected README structure: {filename}')
              # Existing order is About, Requirements, Installation, then the rest.
              ordered = [parts[2], parts[1], parts[0]] + parts[3:]
              body = '\n\n'.join(demote(part) for part in ordered)
              body = body.replace('../THIRD_PARTY_NOTICES.md', 'THIRD_PARTY_NOTICES.md')
              output.append(f'''\n<a id="{code}"></a>\n\n## {label}\n\n{body}\n\n[↑ Back to language selection](#languages)\n\n---\n''')

          Path('README.md').write_text('\n'.join(output).rstrip() + '\n', encoding='utf-8')
          for _, _, filename in langs:
              (docs / filename).unlink()
          try:
              docs.rmdir()
          except OSError:
              pass
          PY
      - name: Commit generated README
        shell: bash
        run: |
          rm -f .github/workflows/finalize-single-readme.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Consolidate multilingual documentation" || exit 0
          git push
