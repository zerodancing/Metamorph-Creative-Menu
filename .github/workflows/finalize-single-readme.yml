name: Finalize single multilingual README

on:
  push:
    paths:
      - '.github/workflows/finalize-single-readme.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build one multilingual README
        run: python3 .github/scripts/build_multilingual_readme.py
      - name: Commit generated README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs
          git commit -m "Consolidate multilingual documentation" || exit 0
          git push
