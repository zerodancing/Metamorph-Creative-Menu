name: Finalize single multilingual README

on:
  push:
    paths:
      - '.github/workflows/finalize-single-readme.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build one multilingual README
        shell: bash
        run: |
          echo '<SECRET>' | base64 -d > /tmp/build_readme.py
          python3 /tmp/build_readme.py
      - name: Commit generated README
        shell: bash
        run: |
          rm -f .github/workflows/finalize-single-readme.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Consolidate multilingual documentation" || exit 0
          git push
