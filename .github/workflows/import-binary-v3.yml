name: Import binary MCM v3

on:
  push:
    branches: [mcm-v3-import]
    paths:
      - '.mcm-import/**'
      - '.github/workflows/import-binary-v3.yml'

permissions:
  contents: write

concurrency:
  group: import-binary-mcm-v3
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and validate MCM 3.0.0
        shell: bash
        run: |
          set -euo pipefail
          test -f .mcm-import/READY
          cat .mcm-import/mcm_v3.part.*.b64 | base64 -d > /tmp/mcm-v3.tar.xz
          EXPECTED="$(tr -d '\r\n ' < .mcm-import/READY)"
          ACTUAL="$(sha256sum /tmp/mcm-v3.tar.xz | awk '{print $1}')"
          test "$ACTUAL" = "$EXPECTED"
          test "$ACTUAL" = 'a4879dfc06b71c46e146fd19ff82425fe7be6601e2aee54f984e417def48e48a'
          tar -tJf /tmp/mcm-v3.tar.xz >/dev/null
          rm -rf metamorph_creative_menu
          tar -xJf /tmp/mcm-v3.tar.xz
          test -f metamorph_creative_menu/mod.xml
          test -f metamorph_creative_menu/mod_id.txt
          test -f metamorph_creative_menu/init.lua
          test -f metamorph_creative_menu/NoitaPatcher/noitapatcher.dll
          test "$(tr -d '\r\n ' < metamorph_creative_menu/VERSION.txt)" = '3.0.0'
          ! grep -RniE 'test_?34|TEST 34' metamorph_creative_menu --exclude-dir=.git
          grep -Fq 'v3.0.0' metamorph_creative_menu/mod.xml

      - name: Refresh public version markers
        shell: python
        run: |
          from pathlib import Path
          for path in Path('.').glob('README*.md'):
              text = path.read_text(encoding='utf-8')
              path.write_text(text.replace('2.0.0', '3.0.0'), encoding='utf-8')

      - name: Commit clean staged release tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .mcm-import
          rm -f .github/workflows/import-binary-v3.yml
          rm -f .github/workflows/import-chunked-v3.yml
          rm -f .github/workflows/export-staging-base.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Stage Metamorph Creative Menu 3.0.0 release tree'
          git push
