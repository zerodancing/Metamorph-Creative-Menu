name: One-time Workshop runtime cleanup

on:
  push:
    branches: [workshop]
    paths:
      - '.github/workflows/workshop-runtime-audit.yml'

permissions:
  contents: write

concurrency:
  group: workshop-runtime-cleanup
  cancel-in-progress: true

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply verified runtime cleanup
        shell: bash
        run: |
          set -euo pipefail
          cat .github/workshop-runtime-cleanup.part1 \
              .github/workshop-runtime-cleanup.part2 \
              .github/workshop-runtime-cleanup.part3 \
              .github/workshop-runtime-cleanup.part4 \
            | base64 -d | gzip -d > /tmp/workshop-runtime-cleanup.patch
          git apply --check /tmp/workshop-runtime-cleanup.patch
          git apply /tmp/workshop-runtime-cleanup.patch
          git diff --check

      - name: Install texlua
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends texlive-binaries >/dev/null

      - name: Run Workshop regression suite
        working-directory: metamorph_creative_menu
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          import subprocess
          import sys

          root = Path('.').resolve()
          texlua = shutil.which('texlua')
          if not texlua:
              raise SystemExit('texlua not found')

          excluded = {'standalone_patcher_contract.py'}
          preferred = [
              'syntax_contract.py',
              'architecture_contract.py',
              'behavior_coverage_contract.py',
              'localization_contract.py',
              'qa_phase_contract.py',
          ]
          contracts = {
              p.name: p for p in (root / 'tests').glob('*_contract.py')
              if p.name not in excluded
          }
          ordered = []
          for name in preferred:
              path = contracts.pop(name, None)
              if path is not None:
                  ordered.append(path)
          ordered.extend(contracts[name] for name in sorted(contracts))
          mocks = sorted((root / 'tests').glob('*_mock.lua'), key=lambda p: p.name)
          commands = [[sys.executable, str(path), str(root)] for path in ordered]
          commands.extend([[texlua, str(path), str(root)] for path in mocks])
          for command in commands:
              print('+', ' '.join(command), flush=True)
              subprocess.run(command, check=True)
          print(
              'WORKSHOP_MIGRATION_TESTS=PASS '
              f'count={len(commands)} contracts={len(ordered)} behavioral_mocks={len(mocks)} '
              'excluded=standalone_patcher_contract.py'
          )
          PY

      - name: Commit cleaned Workshop source
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workshop-runtime-cleanup.part1 \
                .github/workshop-runtime-cleanup.part2 \
                .github/workshop-runtime-cleanup.part3 \
                .github/workshop-runtime-cleanup.part4
          git config user.name "zerodancing"
          git config user.email "unamocenyj@gmail.com"
          git add -A metamorph_creative_menu .github/workshop-runtime-cleanup.part1 \
            .github/workshop-runtime-cleanup.part2 .github/workshop-runtime-cleanup.part3 \
            .github/workshop-runtime-cleanup.part4
          git commit -m "Clean Workshop player runtime"
          git push origin HEAD:workshop
