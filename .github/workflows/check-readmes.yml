name: Check multilingual READMEs

on:
  push:
    branches: [main]
    paths:
      - 'README*.md'
      - 'tools/check_readme_consistency.py'
      - '.github/workflows/check-readmes.yml'
  pull_request:
    paths:
      - 'README*.md'
      - 'tools/check_readme_consistency.py'
      - '.github/workflows/check-readmes.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check README set
        run: python tools/check_readme_consistency.py .
