name: Import full MCM archive

on:
  push:
    paths:
      - 'Metamorph-Creative-Menu-v*.zip'
      - 'Metamorph_Creative_Menu_standalone_noitapatcher*.zip'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import standalone archive
        shell: python
        run: |
          import glob
          import shutil
          import zipfile
          from pathlib import Path, PurePosixPath

          patterns = [
              'Metamorph-Creative-Menu-v*.zip',
              'Metamorph_Creative_Menu_standalone_noitapatcher*.zip',
          ]
          archives = sorted({Path(path) for pattern in patterns for path in glob.glob(pattern)})
          if not archives:
              raise SystemExit(
                  'MCM release archive was not found. Expected a file such as '
                  'Metamorph-Creative-Menu-v3.zip'
              )
          if len(archives) != 1:
              names = ', '.join(path.name for path in archives)
              raise SystemExit(
                  'Expected exactly one MCM release archive in the repository root, found: ' + names
              )

          archive = archives[0]
          print(f'Importing {archive.name}')

          with zipfile.ZipFile(archive) as zf:
              members = zf.infolist()
              for member in members:
                  path = PurePosixPath(member.filename)
                  if path.is_absolute() or '..' in path.parts:
                      raise SystemExit(f'Unsafe archive path: {member.filename}')

              roots = {
                  PurePosixPath(member.filename).parts[0]
                  for member in members
                  if PurePosixPath(member.filename).parts
              }
              if roots != {'metamorph_creative_menu'}:
                  raise SystemExit(f'Unexpected archive root: {sorted(roots)}')

              target = Path('metamorph_creative_menu')
              if target.exists():
                  shutil.rmtree(target)
              zf.extractall('.')

          required = [
              Path('metamorph_creative_menu/VERSION.txt'),
              Path('metamorph_creative_menu/mod.xml'),
              Path('metamorph_creative_menu/mod_id.txt'),
              Path('metamorph_creative_menu/init.lua'),
              Path('metamorph_creative_menu/NoitaPatcher/noitapatcher.dll'),
          ]
          missing = [str(path) for path in required if not path.is_file()]
          if missing:
              raise SystemExit('Missing required files: ' + ', '.join(missing))

          version = Path('metamorph_creative_menu/VERSION.txt').read_text(encoding='utf-8').strip()
          if not version:
              raise SystemExit('VERSION.txt is empty')
          print(f'Imported MCM version {version}')

          archive.unlink()

      - name: Commit imported mod
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Archive contents already match the repository."
            exit 0
          fi
          git commit -m "Import full standalone Metamorph Creative Menu"
          git push
