name: Publish ready-to-install build

on:
  push:
    branches: [main]
    paths:
      - 'metamorph_creative_menu/**'
      - 'tools/build_user_release.py'
      - '.github/workflows/publish-ready-build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-ready-build
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Lua test runtime
        shell: bash
        run: |
          if ! command -v texlua >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y texlive-binaries
          fi

      - name: Check source hygiene
        shell: bash
        run: python tools/check_source_hygiene.py metamorph_creative_menu

      - name: Run regression suite
        shell: bash
        run: python metamorph_creative_menu/tests/run_all.py metamorph_creative_menu

      - name: Build player package
        shell: bash
        run: python tools/build_user_release.py metamorph_creative_menu Metamorph-Creative-Menu.zip

      - name: Validate player package
        shell: python
        run: |
          import zipfile

          archive = 'Metamorph-Creative-Menu.zip'
          forbidden = (
              '/tests/', '/files/qa/', '/files/diagnostics/', '/native_src/', '/tools/',
          )
          forbidden_files = {
              'metamorph_creative_menu/BUILD.txt',
              'metamorph_creative_menu/CHANGELOG.txt',
              'metamorph_creative_menu/VERSION.txt',
              'metamorph_creative_menu/dev_mode.lua',
              'metamorph_creative_menu/mcm_native_gameover.lib',
              'metamorph_creative_menu/mod_id.txt',
              'metamorph_creative_menu/files/core/bounded_log.lua',
              'metamorph_creative_menu/files/features/creatures/diagnostics.lua',
              'metamorph_creative_menu/files/integrations/ew/bridge/qa.lua',
              'metamorph_creative_menu/files/integrations/ew/bridge/qa_reserved.lua',
          }

          with zipfile.ZipFile(archive) as zf:
              names = {name for name in zf.namelist() if not name.endswith('/')}
              required = {
                  'metamorph_creative_menu/mod.xml',
                  'metamorph_creative_menu/init.lua',
                  'metamorph_creative_menu/README.txt',
                  'metamorph_creative_menu/NoitaPatcher/noitapatcher.dll',
                  'metamorph_creative_menu/mcm_native_gameover.dll',
              }
              missing = sorted(required - names)
              if missing:
                  raise SystemExit('Missing runtime files: ' + ', '.join(missing))
              bad = sorted(name for name in names if name in forbidden_files or any(part in name for part in forbidden))
              if bad:
                  raise SystemExit('Development files leaked into player package: ' + ', '.join(bad[:20]))
              readme = zf.read('metamorph_creative_menu/README.txt').decode('utf-8')
              if readme != 'Creator: zerodancing\n':
                  raise SystemExit('Player README.txt is not the minimal creator notice')

      - name: Publish stable download URL
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="$(tr -d '\r\n ' < metamorph_creative_menu/VERSION.txt)"
          git tag -f latest-build HEAD
          git push origin refs/tags/latest-build --force

          notes="Ready-to-install Metamorph: Creative Menu ${version}. Development and QA files are excluded from this archive."
          if gh release view latest-build >/dev/null 2>&1; then
            gh release upload latest-build Metamorph-Creative-Menu.zip --clobber
            gh release edit latest-build --title "Metamorph: Creative Menu ${version}" --notes "$notes"
          else
            gh release create latest-build Metamorph-Creative-Menu.zip --title "Metamorph: Creative Menu ${version}" --notes "$notes"
          fi
