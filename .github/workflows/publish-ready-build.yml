name: Publish ready-to-install build

on:
  push:
    branches: [main]
    paths:
      - 'metamorph_creative_menu/**'
      - 'tools/build_user_release.py'
      - 'tools/validate_user_release.py'
      - 'tools/check_source_hygiene.py'
      - 'tools/import_source_archive.py'
      - 'tools/test_repository_tools.py'
      - '.github/workflows/publish-ready-build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-ready-build
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check repository tooling
        run: |
          python -m compileall -q tools
          python tools/test_repository_tools.py

      - name: Install Lua test runtime
        shell: bash
        run: |
          if ! command -v texlua >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y texlive-binaries
          fi

      - name: Check source hygiene
        run: python tools/check_source_hygiene.py .

      - name: Run regression suite
        run: python metamorph_creative_menu/tests/run_all.py metamorph_creative_menu

      - name: Build player package
        run: python tools/build_user_release.py metamorph_creative_menu Metamorph-Creative-Menu.zip

      - name: Validate player package
        run: python tools/validate_user_release.py Metamorph-Creative-Menu.zip

      - name: Publish stable download URL
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="$(tr -d '\r\n ' < metamorph_creative_menu/VERSION.txt)"
          git tag -f latest-build HEAD
          git push origin refs/tags/latest-build --force

          notes="Ready-to-install Metamorph: Creative Menu ${version}. Development and QA files are excluded from this archive."
          if gh release view latest-build >/dev/null 2>&1; then
            gh release upload latest-build Metamorph-Creative-Menu.zip --clobber
            gh release edit latest-build --title "Metamorph: Creative Menu ${version}" --notes "$notes"
          else
            gh release create latest-build Metamorph-Creative-Menu.zip --title "Metamorph: Creative Menu ${version}" --notes "$notes"
          fi
