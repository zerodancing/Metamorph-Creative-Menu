name: English source cleanup

on:
  push:
    paths:
      - '.github/workflows/english-source-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Translate internal docs and remove source-language hardcoding
        run: python3 .github/scripts/english_source_cleanup.py
      - name: Verify translation CSV structure
        run: |
          python3 - <<'PY'
          import csv
          from pathlib import Path
          path = Path('metamorph_creative_menu/translations.csv')
          with path.open(encoding='utf-8-sig', newline='') as handle:
              rows = list(csv.reader(handle))
          width = len(rows[0])
          bad = [index + 1 for index, row in enumerate(rows) if len(row) != width]
          if bad:
              raise SystemExit(f'translations.csv row-width mismatch: {bad[:10]}')
          print(f'translations.csv rows={len(rows)-1} columns={width}')
          PY
      - name: Remove one-shot maintenance files and commit
        run: |
          rm -rf .github/tmp
          rm -f .github/scripts/english_source_cleanup.py
          rm -f .github/scripts/build_multilingual_readme.py
          rm -f .github/workflows/finalize-single-readme.yml
          rm -f .github/workflows/english-source-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Standardize project source and documentation language" || exit 0
          git push
