name: Check repository tooling

on:
  push:
    branches: [main]
    paths:
      - 'tools/*.py'
      - '.github/workflows/check-repository-tools.yml'
  pull_request:
    paths:
      - 'tools/*.py'
      - '.github/workflows/check-repository-tools.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile repository Python tools
        run: python -m compileall -q tools
      - name: Run tooling contract tests
        run: python tools/test_repository_tools.py
