name: One-time stale branch cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-stale-branches.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete obsolete staging branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for branch in \
            mcm-v3-direct \
            repo-release-cleanup \
            mcm-upload-staging \
            release-staging-polish13 \
            mcm-v3-import
          do
            echo "Deleting $branch"
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
          done
