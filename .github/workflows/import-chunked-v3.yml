name: Import staged MCM v3

on:
  push:
    branches: [main]
    paths:
      - '.mcm-import/**'
      - '.github/workflows/import-chunked-v3.yml'

permissions:
  contents: write

concurrency:
  group: import-staged-mcm-v3
  cancel-in-progress: false

jobs:
  import:
    if: ${{ hashFiles('.mcm-import/READY') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and validate release candidate
        shell: bash
        run: |
          set -euo pipefail
          cat .mcm-import/chunk_*.b64 | base64 -d > /tmp/mcm-v3.tar.xz
          EXPECTED="$(tr -d '\r\n ' < .mcm-import/READY)"
          ACTUAL="$(sha256sum /tmp/mcm-v3.tar.xz | awk '{print $1}')"
          test "$ACTUAL" = "$EXPECTED"
          tar -tJf /tmp/mcm-v3.tar.xz >/dev/null
          rm -rf metamorph_creative_menu
          tar -xJf /tmp/mcm-v3.tar.xz
          test -f metamorph_creative_menu/mod.xml
          test -f metamorph_creative_menu/mod_id.txt
          test -f metamorph_creative_menu/init.lua
          test -f metamorph_creative_menu/NoitaPatcher/noitapatcher.dll
          test "$(tr -d '\r\n ' < metamorph_creative_menu/VERSION.txt)" = "3.0.0"
          ! grep -RniE 'test_?34|TEST 34' metamorph_creative_menu --exclude-dir=.git

      - name: Remove old public version markers
        shell: python
        run: |
          from pathlib import Path
          for path in Path('.').glob('README*.md'):
              text = path.read_text(encoding='utf-8')
              path.write_text(text.replace('2.0.0', '3.0.0'), encoding='utf-8')

      - name: Commit clean v3 source tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .mcm-import
          rm -f .github/workflows/import-chunked-v3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Release Metamorph Creative Menu 3.0.0"
          git push
