name: Import staged MCM payload

on:
  push:
    branches:
      - mcm-upload-staging
    paths:
      - '.mcm_upload/READY'

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out staging branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode and extract payload
        shell: python
        run: |
          import hashlib
          import shutil
          import tarfile
          from pathlib import Path, PurePosixPath

          payload_dir = Path('.mcm_upload')
          chunks = sorted(payload_dir.glob('chunk_*.txt'))
          if len(chunks) != 28:
              raise SystemExit(f'Expected 28 chunks, found {len(chunks)}')

          text = ''.join(path.read_text(encoding='utf-8') for path in chunks)
          if len(text) != 274552:
              raise SystemExit(f'Encoded character count mismatch: {len(text)}')
          if len(text) % 2:
              raise SystemExit('Encoded payload has an odd character count')

          decoded = bytearray()
          for index in range(0, len(text), 2):
              hi = ord(text[index]) - 0x10000
              lo = ord(text[index + 1]) - 0x10000
              if not (0 <= hi <= 0xFFFFF and 0 <= lo <= 0xFFFFF):
                  raise SystemExit(f'Invalid encoded character at pair {index // 2}')
              decoded.extend(((hi << 20) | lo).to_bytes(5, 'big'))

          data = bytes(decoded[:686376])
          digest = hashlib.sha256(data).hexdigest()
          expected = 'f58feb299c14f592482c40e617910bb66c68f0fa50672c729a038f97dbc6187f'
          if digest != expected:
              raise SystemExit(f'Payload SHA-256 mismatch: {digest}')

          archive = Path('/tmp/mcm_payload.tar.xz')
          archive.write_bytes(data)

          with tarfile.open(archive, 'r:xz') as tf:
              members = tf.getmembers()
              roots = set()
              for member in members:
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or '..' in path.parts:
                      raise SystemExit(f'Unsafe archive path: {member.name}')
                  if path.parts:
                      roots.add(path.parts[0])
              if roots != {'metamorph_creative_menu'}:
                  raise SystemExit(f'Unexpected archive root: {sorted(roots)}')

              target = Path('metamorph_creative_menu')
              if target.exists():
                  shutil.rmtree(target)
              tf.extractall('.')

          required = [
              Path('metamorph_creative_menu/mod.xml'),
              Path('metamorph_creative_menu/mod_id.txt'),
              Path('metamorph_creative_menu/init.lua'),
              Path('metamorph_creative_menu/NoitaPatcher/noitapatcher.dll'),
          ]
          missing = [str(path) for path in required if not path.is_file()]
          if missing:
              raise SystemExit('Missing required files: ' + ', '.join(missing))

      - name: Verify exact mod tree
        shell: bash
        run: |
          git add -A metamorph_creative_menu
          root_tree="$(git write-tree)"
          mod_tree="$(git ls-tree "$root_tree" metamorph_creative_menu | awk '{print $3}')"
          test "$mod_tree" = "8d856676dd91030b1fd51f69e841d17014ef8b61"

      - name: Commit imported mod
        shell: bash
        run: |
          rm -rf .mcm_upload
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Stage exact Metamorph Creative Menu archive"
          git push
